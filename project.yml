name: MyBetterLife
options:
  bundleIdPrefix: com.igordonatti
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  xcodeVersion: "16.0"
  developmentLanguage: pt-BR

packages:
  MyBetterLife:
    path: .

targets:
  MyBetterLife:
    type: application
    supportedDestinations:
      - iOS
      - macOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - MyBetterLife.entitlements
          - AppIcon.icns
    info:
      path: App/Info.plist
    entitlements:
      path: App/MyBetterLife.entitlements
    dependencies:
      - package: MyBetterLife
        product: MyBetterLifeCore
      - package: MyBetterLife
        product: MyBetterLifeUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.igordonatti.mybetterlife
        PRODUCT_NAME: My Better Life
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "4"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
